# Backup diário do banco (Neon) e dos documentos (R2) para o Backblaze B2.
#
# Roda scripts/backup/backup.sh — o mesmo que se roda na mão. Configuração,
# retenção e restauração em docs/backup.md.
#
# ATENÇÃO: o GitHub só dispara `schedule` a partir da branch PADRÃO do
# repositório. Enquanto este arquivo não estiver nela, o backup não roda
# sozinho (o `workflow_dispatch` funciona de qualquer branch).
name: Backup diário

on:
  schedule:
    # 07h UTC = 04h de Brasília, fora do horário de uso.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Dois backups ao mesmo tempo escreveriam o mesmo arquivo do dia.
concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
    steps:
      - uses: actions/checkout@v4

      # O pg_dump precisa ser da mesma versão principal do Postgres do Neon,
      # ou mais nova — o do Ubuntu fica para trás. Vem do repositório oficial
      # do PostgreSQL (PGDG). A versão é a variável PG_MAJOR do repositório.
      - name: Instalar pg_dump e rclone
        env:
          PG_MAJOR: ${{ vars.PG_MAJOR || '17' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common rclone
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq "postgresql-client-$PG_MAJOR"
          echo "PG_BIN=/usr/lib/postgresql/$PG_MAJOR/bin" >> "$GITHUB_ENV"

      - name: Backup
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
          DOCS_S3_ENDPOINT: ${{ secrets.DOCS_S3_ENDPOINT }}
          DOCS_S3_BUCKET: ${{ secrets.DOCS_S3_BUCKET }}
          DOCS_S3_ACCESS_KEY_ID: ${{ secrets.DOCS_S3_ACCESS_KEY_ID }}
          DOCS_S3_SECRET_ACCESS_KEY: ${{ secrets.DOCS_S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
        run: scripts/backup/backup.sh

      # Falha o GitHub avisa por e-mail. O que ele não avisa é o backup que
      # deixou de rodar (workflow desativado, agendamento perdido): para isso,
      # o Healthchecks.io espera este sinal todo dia e manda e-mail se faltar.
      - name: Avisar que o backup rodou
        if: success() && env.HEALTHCHECK_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" > /dev/null
