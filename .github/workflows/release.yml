# Constrói o pacote de instalação on-premise e publica como Release.
#
# POR QUE windows-latest: o CLI do Prisma carrega um binário nativo por
# plataforma (schema-engine). O pacote leva esse CLI dentro, porque a máquina do
# cliente não tem internet e precisa rodar `migrate deploy` sozinha — então o
# binário empacotado tem que ser o do Windows. Um build no Mac ou no Ubuntu sai
# com o binário errado e quebra no passo da migration, na frente do cliente.
# A mesma regra vale para o `sharp` do Next. Build na plataforma de destino.
#
# O que ESTE workflow não faz: entregar. A máquina do cliente não fala com o
# GitHub (por decisão dele, não por falta de infraestrutura). O pacote sai daqui
# e chega lá por pen drive ou pasta de rede — ver docs/instalacao-on-premise.md,
# seção 3.
name: Release on-premise

on:
  push:
    tags:
      # v2026.09.15 — a versão é a data, que é como o cliente vai falar dela.
      - "v*"
  # Para gerar um pacote de teste sem criar tag.
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão do pacote (ex.: 2026.09.15-teste)"
        required: true

permissions:
  contents: write

jobs:
  empacotar:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ler a versão do Node do .nvmrc
        uses: actions/setup-node@v4
        with:
          # A mesma linha de versão que o instalador confere na máquina do
          # cliente: `standalone` traz as dependências, não traz o runtime.
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        # `npm ci` e não `npm install`: o pacote tem que sair do
        # package-lock.json, não de uma resolução nova a cada build.
        run: npm ci

      - name: Conferir tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        # Regra de negócio com teste é o que segura esta etapa: um pacote que
        # sai daqui vai para uma máquina sem internet, onde corrigir custa
        # deslocamento.
        run: npm test

      - name: Definir a versão
        id: versao
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $v = $env:GITHUB_REF -replace "^refs/tags/v", ""
          } else {
            $v = "${{ github.event.inputs.versao }}"
          }
          if (-not $v) { throw "sem versão" }
          "versao=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Versão: $v"

      - name: Empacotar
        run: node scripts/empacotar.mjs --versao ${{ steps.versao.outputs.versao }}

      - name: Cache dos componentes do kit
        # O instalador do PostgreSQL tem ~350 MB e só muda quando a versão
        # fixada em componentes.json muda. O hash continua sendo conferido.
        uses: actions/cache@v4
        with:
          path: dist/.cache
          key: kit-componentes-${{ hashFiles('scripts/kit/componentes.json') }}

      - name: Montar o kit de instalação
        run: node scripts/montar-kit.mjs --versao ${{ steps.versao.outputs.versao }}

      - name: Guardar o kit como artefato
        uses: actions/upload-artifact@v4
        with:
          name: aja-obras-kit-${{ steps.versao.outputs.versao }}
          path: |
            dist/aja-obras-kit-${{ steps.versao.outputs.versao }}.zip
            dist/aja-obras-kit-${{ steps.versao.outputs.versao }}.zip.sha256
          retention-days: 30
          # Já é .zip de coisa comprimida: comprimir de novo só gasta tempo.
          compression-level: 0

      - name: Guardar o pacote como artefato
        uses: actions/upload-artifact@v4
        with:
          name: aja-obras-${{ steps.versao.outputs.versao }}
          path: |
            dist/aja-obras-${{ steps.versao.outputs.versao }}.zip
            dist/aja-obras-${{ steps.versao.outputs.versao }}.zip.sha256
          retention-days: 30

      - name: Publicar o Release
        # Só em tag: o build manual serve para testar o empacotamento, e não
        # deve criar release.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # O repositório é privado, então o Release também é — o `.zip` é o
          # sistema compilado do cliente.
          files: |
            dist/aja-obras-${{ steps.versao.outputs.versao }}.zip
            dist/aja-obras-${{ steps.versao.outputs.versao }}.zip.sha256
            dist/aja-obras-kit-${{ steps.versao.outputs.versao }}.zip
            dist/aja-obras-kit-${{ steps.versao.outputs.versao }}.zip.sha256
          body: |
            Sistema de Gestão de Obras — versão ${{ steps.versao.outputs.versao }}.

            **Instalação nova:** baixe o **kit** (`aja-obras-kit-…zip`),
            extraia e dê duplo clique em `INSTALAR.cmd`. Passo a passo em
            `docs/roteiro-instalacao.md`.

            **Atualização:** copie o `aja-obras-${{ steps.versao.outputs.versao }}.zip`
            **e o `.sha256`** para `D:\aja-obras\pacotes\` e dê duplo clique em
            `D:\aja-obras\ATUALIZAR.cmd`.

            O script confere a integridade, faz dump do banco, aplica as
            migrations, troca a versão e verifica se o sistema respondeu —
            voltando sozinho para a versão anterior se algo falhar.
